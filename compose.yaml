services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: simplebase
      POSTGRES_PASSWORD: simplebase
      POSTGRES_DB: simplebase
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplebase -d simplebase"]
      interval: 1s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
